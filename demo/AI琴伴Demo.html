<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 琴伴 - Interactive Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:#0f0f0f;
    display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.7}}
  @keyframes recDot{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes waveBar{0%,100%{height:12%}50%{height:85%}}
  @keyframes spinRing{to{transform:rotate(360deg)}}
  @keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  .phone-outer{width:390px;height:844px;border-radius:52px;background:#1a1a1a;padding:10px;position:relative;
    box-shadow:0 0 0 2px #333,0 40px 80px rgba(0,0,0,.6),inset 0 0 0 1px #2a2a2a}
  .phone-inner{width:100%;height:100%;border-radius:44px;overflow:hidden;position:relative;background:#fff}
  .phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:34px;
    background:#1a1a1a;border-radius:0 0 22px 22px;z-index:100}
  .phone-notch::after{content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:10px;height:10px;border-radius:50%;background:#2a2a2a}
  .status-bar{height:54px;padding:14px 28px 0;display:flex;justify-content:space-between;align-items:center;
    font-size:13px;font-weight:600;position:relative;z-index:101}
  .status-bar.light{color:#fff}
  .status-bar.dark{color:#1C1B1F}
  .screen-body{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden}
  .scroll-area{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .scroll-area::-webkit-scrollbar{display:none}
  .bottom-nav{position:absolute;bottom:0;left:0;right:0;height:82px;padding-bottom:20px;
    display:flex;justify-content:space-around;align-items:center;background:#fff;
    border-top:1px solid #E8E6E3;z-index:50}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
    padding:6px 16px;border:none;background:none;font-family:inherit}
  .nav-item .nav-icon{width:24px;height:24px;border-radius:6px}
  .nav-item .nav-label{font-size:10px;font-weight:500}
  .home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:134px;height:5px;background:#1C1B1F;border-radius:3px;opacity:.2;z-index:200}
  .card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .btn-primary{width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;
    font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
  .btn-primary:active{transform:scale(.97)}
  .screen-transition{animation:fadeUp .35s ease-out}
  .wave-container{display:flex;align-items:center;justify-content:center;gap:4px;height:60px}
  .wave-bar{width:4px;border-radius:2px;animation:waveBar 1s ease-in-out infinite}
  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .issue-item{display:flex;align-items:center;gap:12px;padding:12px;background:#F7F6F3;
    border-radius:12px;margin-bottom:8px}
</style>
</head>
<body>

  {id:2,score:72,date:'2025-01-13 16:00',title:'欢乐颂',duration:95},

/* ═══════════════════ AVATAR SVG ═══════════════════ */
function Avatar2D({speaking=false,size=100}) {
  const [mouthOpen,setMouthOpen] = useState(0);
  const [blink,setBlink] = useState(false);
  useEffect(()=>{
    if(!speaking){setMouthOpen(0);return}
    let frame;const animate=()=>{
      setMouthOpen(Math.random()*0.7+0.3);
      frame=setTimeout(animate,120+Math.random()*80);
    };animate();return()=>clearTimeout(frame);
  },[speaking]);
  useEffect(()=>{
    const t=setInterval(()=>{setBlink(true);setTimeout(()=>setBlink(false),150)},3200);
    return()=>clearInterval(t);
  },[]);
  const s = size/120;
  return (
    <svg width={size} height={size} viewBox="0 0 120 120">
      {speaking && <circle cx="60" cy="62" r="52" fill={C.primary} opacity=".12">
        <animate attributeName="r" values="50;55;50" dur="1.5s" repeatCount="indefinite"/>
      </circle>}
      {/* Hair back */}
      <ellipse cx="60" cy="60" rx="48" ry="50" fill="#4A3728"/>
      {/* Face */}
      <ellipse cx="60" cy="64" rx="38" ry="40" fill="#FFE0C2"/>
      {/* Hair top + bangs */}
      <path d="M12 56 Q12 14 60 12 Q108 14 108 56 Q98 32 60 30 Q22 32 12 56Z" fill="#4A3728"/>
      <path d="M24 50 Q34 36 48 46 Q38 40 24 50Z" fill="#5D4A3A"/>
      <path d="M42 44 Q54 32 68 42 Q58 36 42 44Z" fill="#5D4A3A"/>
      <path d="M62 42 Q76 34 92 48 Q80 38 62 42Z" fill="#5D4A3A"/>
      {/* Eyes */}
      {blink ? (
        <><line x1="38" y1="62" x2="50" y2="62" stroke="#3D2B1F" strokeWidth="2.5" strokeLinecap="round"/>
        <line x1="70" y1="62" x2="82" y2="62" stroke="#3D2B1F" strokeWidth="2.5" strokeLinecap="round"/></>
      ) : (
        <><circle cx="44" cy="62" r="4.5" fill="#3D2B1F"/><circle cx="76" cy="62" r="4.5" fill="#3D2B1F"/>
        <circle cx="45.5" cy="60.5" r="1.5" fill="#fff"/><circle cx="77.5" cy="60.5" r="1.5" fill="#fff"/></>
      )}
      {/* Eyebrows */}
      <path d="M36 52 Q44 48 52 52" fill="none" stroke="#4A3728" strokeWidth="2" strokeLinecap="round"/>
      <path d="M68 52 Q76 48 84 52" fill="none" stroke="#4A3728" strokeWidth="2" strokeLinecap="round"/>
      {/* Blush */}
      <ellipse cx="34" cy="72" rx="7" ry="4" fill="#FFB5A7" opacity=".35"/>
      <ellipse cx="86" cy="72" rx="7" ry="4" fill="#FFB5A7" opacity=".35"/>
      {/* Mouth */}
      {speaking && mouthOpen > 0.1 ? (
        <ellipse cx="60" cy="82" rx={6+mouthOpen*4} ry={3+mouthOpen*7} fill="#D4726A">
          <animate attributeName="ry" values={`${3+mouthOpen*7};${2+mouthOpen*4};${3+mouthOpen*7}`} dur="0.15s" repeatCount="indefinite"/>
        </ellipse>
      ) : (
        <path d="M52 80 Q60 87 68 80" fill="none" stroke="#D4726A" strokeWidth="2.5" strokeLinecap="round"/>
      )}
      {speaking && mouthOpen > 0.3 && <ellipse cx="60" cy="84" rx="4" ry="2" fill="#E8998D" opacity=".6"/>}
    </svg>
  );
}

/* ═══════════════════ RADAR CHART ═══════════════════ */
function RadarChart({data}) {
  const cx=120,cy=110,maxR=75;
  const dims=[
    {label:'节奏',value:data.rhythm,color:C.info},
    {label:'音准',value:data.accuracy,color:C.success},
    {label:'流畅度',value:data.fluency,color:C.warning},
    {label:'手型',value:data.handHealth,color:C.primary},
  ];
  const n=dims.length;
  const getPoint=(i,r)=>{
    const angle=-Math.PI/2+(2*Math.PI/n)*i;
    return[cx+r*Math.cos(angle),cy+r*Math.sin(angle)];
  };
  const gridLevels=[0.25,0.5,0.75,1];
  const dataPoints=dims.map((d,i)=>{
    const[x,y]=getPoint(i,maxR*d.value/100);
    return`${x},${y}`;
  }).join(' ');
  return (
    <svg width="240" height="220" viewBox="0 0 240 220" style={{display:'block',margin:'0 auto'}}>
      {gridLevels.map((lvl,gi)=>{
        const pts=Array.from({length:n},(_,i)=>getPoint(i,maxR*lvl).join(',')).join(' ');
        return<polygon key={gi} points={pts} fill="none" stroke={C.border} strokeWidth="1" opacity={.6}/>;
      })}
      {dims.map((_,i)=>{
        const[x,y]=getPoint(i,maxR);
        return<line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={C.border} strokeWidth="1" opacity={.4}/>;
      })}
      <polygon points={dataPoints} fill={C.primary} fillOpacity=".15" stroke={C.primary} strokeWidth="2.5"/>
      {dims.map((d,i)=>{
        const[x,y]=getPoint(i,maxR*d.value/100);
        return<circle key={i} cx={x} cy={y} r="4" fill={C.primary} stroke="#fff" strokeWidth="2"/>;
      })}
      {dims.map((d,i)=>{
        const[x,y]=getPoint(i,maxR+22);
        return<text key={i} x={x} y={y} textAnchor="middle" dominantBaseline="middle"
          fontSize="12" fontWeight="600" fill={C.textSecondary}>{d.label} {d.value}</text>;
      })}
    </svg>
  );
}

/* ═══════════════════ SCORE GAUGE ═══════════════════ */
function ScoreGauge({score,animProgress}) {
  const r=70,circumference=2*Math.PI*r;
  const offset=circumference*(1-score/100*animProgress);
  const color = score>=90?C.success : score>=75?C.accent : C.danger;
  const displayScore=Math.round(score*animProgress);
  return (
    <div style={{position:'relative',width:180,height:180,margin:'0 auto'}}>
      <svg width="180" height="180" viewBox="0 0 180 180">
        <circle cx="90" cy="90" r={r} fill="none" stroke={C.surfaceAlt} strokeWidth="12"/>
        <circle cx="90" cy="90" r={r} fill="none" stroke={color} strokeWidth="12"
          strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={offset}
          transform="rotate(-90 90 90)" style={{transition:'stroke-dashoffset 1.5s cubic-bezier(.16,1,.3,1)'}}/>
      </svg>
      <div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',textAlign:'center'}}>
        <div style={{fontSize:48,fontWeight:700,color,lineHeight:1,fontVariantNumeric:'tabular-nums'}}>
          {displayScore}</div>
        <div style={{fontSize:13,color:C.textSecondary,fontWeight:500,marginTop:4}}>综合评分</div>
      </div>
    </div>
  );
}

/* ═══════════════════ STATUS BAR ═══════════════════ */

/* ═══════════════════ BOTTOM NAV ═══════════════════ */
function BottomNav({screen,onNav}) {
  const items=[
    {id:'home',label:'首页',icon:(c)=><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round"><path d="M3 12L12 3l9 9"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg>},
    {id:'history',label:'历史',icon:(c)=><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>},
    {id:'settings',label:'设置',icon:(c)=><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>},
  ];
  return (
    <div className="bottom-nav">
      {items.map(item=>{
        const active=screen===item.id;
        const color=active?C.primary:C.textTertiary;
        return(
          <button key={item.id} className="nav-item" onClick={()=>onNav(item.id)}>
            {item.icon(color)}
            <span className="nav-label" style={{color}}>{item.label}</span>
          </button>
        );
      })}
    </div>
  );
}

/* ═══════════════════ HOME SCREEN ═══════════════════ */

/* ═══════════════════ PRACTICE SCREEN ═══════════════════ */
function PracticeScreen({onStop}) {
  const[elapsed,setElapsed]=useState(0);
  const[pulseScale,setPulseScale]=useState(1);
  useEffect(()=>{
    const t=setInterval(()=>setElapsed(e=>e+1),1000);
    const p=setInterval(()=>setPulseScale(s=>s>1?1:1.15),750);
    const auto=setTimeout(onStop,6000);
    return()=>{clearInterval(t);clearInterval(p);clearTimeout(auto)};
  },[onStop]);
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  return(
    <div className="screen-body" style={{background:'#0a0a0a'}}>

              {i%2===0 && <div style={{position:'absolute',top:0,width:'60%',height:'55%',background:'#1a1a1a',

    setScreen('home');
    setHistory(prev=>[{id:Date.now(),score:85,date:new Date().toLocaleString('zh-CN'),
      title:scoreName||'即兴练习',duration:127},...prev]);
  };
  const handleViewReport = (item)=>{
    setScreen('feedback');
  };

  // Auto-transition: loading -> feedback
  useEffect(()=>{
    if(screen==='loading'){
      const t=setTimeout(()=>setScreen('feedback'),3500);
      return()=>clearTimeout(t);
    }
  },[screen]);

  const showNav = ['home','history','settings'].includes(screen);

  return(
    <div className="phone-outer">
      <div className="phone-notch"/>
      <div className="phone-inner">
        {screen==='home' && <HomeScreen onStartPractice={handleStartPractice}
          scoreName={scoreName} onUpload={handleUpload}/>}
        {screen==='practice' && <PracticeScreen onStop={handleStopPractice}/>}
        {screen==='loading' && <LoadingScreen/>}
        {screen==='feedback' && <FeedbackScreen report={mockReport} onBack={handleBackToHome}/>}
        {screen==='history' && <HistoryScreen history={history} onViewReport={handleViewReport}/>}
        {screen==='settings' && <SettingsScreen/>}
        {showNav && <BottomNav screen={screen} onNav={setScreen}/>}
        <div className="home-indicator"/>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
