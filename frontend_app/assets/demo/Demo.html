<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>琴伴 - 智能钢琴陪练系统</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --pri-1:#FF6B6B;--pri-2:#FF8E53;--pri-3:#FFA07A;
  --grad:linear-gradient(135deg,#FF6B6B,#FF8E53);
  --grad-soft:linear-gradient(135deg,#FFF0ED,#FFF5EE);
  --bg:#FFF8F6;--card:#FFFFFF;
  --text:#2D2D2D;--text-2:#6B7280;--text-3:#9CA3AF;
  --success:#10B981;--warn:#F59E0B;--danger:#EF4444;--info:#3B82F6;--purple:#8B5CF6;
  --radius:16px;--shadow:0 4px 24px rgba(0,0,0,0.06);
}
html{font-size:16px}
body{
  font-family:'SF Pro Display',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(160deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;overflow:hidden;color:var(--text);
}

.phone-frame{
  width:390px;height:844px;
  background:#111;border-radius:40px;
  padding:8px;position:relative;
  box-shadow:0 40px 80px rgba(0,0,0,0.5),inset 0 0 0 2px #333;
}
.phone-screen{
  width:100%;height:100%;border-radius:34px;overflow:hidden;
  position:relative;background:var(--bg);
}

.status-bar{
  height:44px;padding:8px 24px 0;
  display:flex;justify-content:space-between;align-items:center;
  font-size:14px;font-weight:600;position:relative;z-index:50;
}
.status-bar.light{color:#fff}
.status-bar.dark{color:var(--text)}
.status-icons{display:flex;gap:4px;align-items:center;font-size:12px}

.pages{width:100%;height:100%;position:relative}
.page{
  position:absolute;inset:0;
  opacity:0;pointer-events:none;
  transition:opacity 0.4s ease,transform 0.4s ease;
  transform:translateX(20px);
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
.page.active{opacity:1;pointer-events:auto;transform:translateX(0)}
.page::-webkit-scrollbar{width:0}

/* ===== HOME ===== */
#page-home{background:var(--bg)}
.home-header{
  background:var(--grad);
  padding:16px 24px 36px;
  border-radius:0 0 32px 32px;
  position:relative;overflow:hidden;
}
.home-header::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,0.1);
}
.home-header::after{
  content:'';position:absolute;bottom:-20px;left:-20px;
  width:100px;height:100px;border-radius:50%;
  background:rgba(255,255,255,0.06);
}
.home-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.home-logo{display:flex;align-items:center;gap:10px}
.home-logo-icon{
  width:36px;height:36px;border-radius:10px;
  background:rgba(255,255,255,0.2);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
}
.home-title{color:#fff;font-size:22px;font-weight:700;letter-spacing:-0.5px}
.home-actions{display:flex;gap:8px;position:relative;z-index:2}
.icon-btn{
  width:40px;height:40px;border-radius:14px;border:none;
  background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;transition:all 0.2s;
}
.icon-btn:hover{background:rgba(255,255,255,0.25);transform:scale(1.05)}
.home-greeting{margin-top:24px;position:relative;z-index:2}
.home-greeting h2{color:#fff;font-size:22px;font-weight:700}
.home-greeting p{color:rgba(255,255,255,0.75);font-size:14px;margin-top:6px}

.home-body{padding:20px}
.score-card{
  background:var(--card);border-radius:20px;padding:20px;
  box-shadow:var(--shadow);margin-bottom:16px;
  display:flex;align-items:center;gap:16px;
}
.score-icon{
  width:56px;height:56px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;
}
.score-icon.empty{background:linear-gradient(135deg,#E5E7EB,#D1D5DB)}
.score-icon.has{background:var(--grad)}
.score-info{flex:1;min-width:0}
.score-info .label{font-size:12px;color:var(--text-2);font-weight:500}
.score-info .name{font-size:17px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-badge{
  padding:4px 10px;border-radius:10px;font-size:11px;font-weight:600;
  background:#DCFCE7;color:#16A34A;flex-shrink:0;
}

.btn{
  width:100%;padding:18px;border:none;border-radius:var(--radius);
  font-size:16px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:all 0.25s;position:relative;overflow:hidden;
}
.btn:active{transform:scale(0.98)}
.btn-upload{
  background:var(--card);color:var(--pri-1);
  box-shadow:var(--shadow);margin-bottom:12px;
}
.btn-upload:hover{box-shadow:0 6px 28px rgba(255,107,107,0.15)}
.btn-primary{
  background:var(--grad);color:#fff;font-size:18px;padding:22px;
  box-shadow:0 8px 30px rgba(255,107,107,0.3);
}
.btn-primary:hover{box-shadow:0 10px 40px rgba(255,107,107,0.4);transform:translateY(-1px)}

.tips-card{
  background:var(--card);border-radius:20px;padding:20px;
  box-shadow:var(--shadow);margin-top:16px;
}
.tips-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.tips-icon{
  width:32px;height:32px;border-radius:8px;
  background:#FEF3C7;display:flex;align-items:center;justify-content:center;font-size:16px;
}
.tips-title{font-size:15px;font-weight:600}
.tip-row{display:flex;align-items:center;gap:10px;padding:8px 0;color:var(--text-2);font-size:14px}
.tip-row .dot{width:6px;height:6px;border-radius:50%;background:var(--pri-1);flex-shrink:0}

/* ===== PRACTICE ===== */
#page-practice{background:#111}
.practice-bg{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0.3) 0%,rgba(0,0,0,0.7) 100%);
}
.practice-content{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:10;padding:24px;
}
.rec-badge{
  position:absolute;top:12px;left:24px;
  background:rgba(239,68,68,0.9);padding:6px 14px;
  border-radius:20px;display:flex;align-items:center;gap:6px;
  color:#fff;font-size:13px;font-weight:700;
}
.rec-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.practice-timer{
  font-size:64px;font-weight:200;color:#fff;
  font-variant-numeric:tabular-nums;letter-spacing:2px;margin-bottom:8px;
}
.practice-hint{color:rgba(255,255,255,0.6);font-size:15px;text-align:center;margin-bottom:40px}
.stop-btn{
  width:88px;height:88px;border-radius:50%;
  background:#fff;border:5px solid var(--danger);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;box-shadow:0 0 30px rgba(239,68,68,0.3);
}
.stop-btn:hover{transform:scale(1.05)}
.stop-btn:active{transform:scale(0.95)}
.stop-inner{width:30px;height:30px;background:var(--danger);border-radius:6px}
.practice-pulse{
  position:absolute;width:88px;height:88px;border-radius:50%;
  border:2px solid rgba(239,68,68,0.4);
  animation:pulse 2s infinite;pointer-events:none;
}
@keyframes pulse{
  0%{transform:scale(1);opacity:0.6}
  100%{transform:scale(1.8);opacity:0}
}
.practice-banner{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.9);
  display:flex;flex-direction:column;align-items:center;gap:14px;
  z-index:20;
  opacity:0;pointer-events:none;
  transition:opacity 0.4s ease,transform 0.4s ease;
}
.practice-banner.show{
  opacity:1;transform:translate(-50%,-50%) scale(1);
}
.banner-icon{
  width:72px;height:72px;border-radius:50%;
  background:rgba(239,68,68,0.9);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;color:#fff;
  box-shadow:0 0 40px rgba(239,68,68,0.5);
  animation:bannerPulse 1.5s ease-in-out infinite;
}
@keyframes bannerPulse{
  0%,100%{box-shadow:0 0 30px rgba(239,68,68,0.4)}
  50%{box-shadow:0 0 50px rgba(239,68,68,0.7)}
}
.banner-text{
  color:#fff;font-size:20px;font-weight:600;
  background:rgba(0,0,0,0.5);padding:8px 24px;border-radius:20px;
  backdrop-filter:blur(8px);letter-spacing:1px;
}

/* Video upload area in practice page */
.upload-area{
  display:flex;flex-direction:column;align-items:center;gap:16px;
  margin-bottom:32px;
}
.upload-btn{
  padding:16px 32px;border-radius:20px;border:2px dashed rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.08);color:#fff;font-size:16px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:10px;
  transition:all 0.2s;backdrop-filter:blur(8px);
}
.upload-btn:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.5)}
.upload-name{color:rgba(255,255,255,0.5);font-size:13px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== LOADING ===== */
#page-loading{background:#111}
.loading-content{
  height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:28px;
}
.loading-ring{width:72px;height:72px;position:relative}
.loading-ring::before{
  content:'';position:absolute;inset:0;
  border:3px solid rgba(255,107,107,0.15);border-radius:50%;
}
.loading-ring::after{
  content:'';position:absolute;inset:0;
  border:3px solid transparent;border-top-color:var(--pri-1);
  border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#fff;font-size:20px;font-weight:600}
.loading-sub{color:rgba(255,255,255,0.4);font-size:14px;margin-top:-16px}
.loading-steps{display:flex;gap:24px;margin-top:8px}
.loading-step{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  opacity:0.3;transition:opacity 0.5s;
}
.loading-step.active{opacity:1}
.loading-step .step-dot{width:10px;height:10px;border-radius:50%;background:var(--pri-1)}
.loading-step .step-label{color:rgba(255,255,255,0.7);font-size:12px}

/* ===== FEEDBACK ===== */
#page-feedback{background:var(--bg)}
.feedback-header{
  background:var(--grad);padding:16px 24px 32px;
  border-radius:0 0 32px 32px;text-align:center;
  position:relative;overflow:hidden;
}
.feedback-header::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,0.08);
}
.feedback-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;position:relative;z-index:2;
}
.back-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:6px}
.feedback-title{color:#fff;font-size:18px;font-weight:600}

.avatar-container{width:110px;height:110px;margin:0 auto 16px;position:relative}
.avatar-glow{
  position:absolute;inset:-8px;border-radius:50%;
  background:rgba(255,255,255,0.15);filter:blur(12px);
}
.avatar{
  width:110px;height:110px;border-radius:50%;
  background:transparent;position:relative;
  box-shadow:0 8px 30px rgba(0,0,0,0.15);overflow:hidden;
}
.avatar-img{
  width:100%;height:100%;object-fit:cover;display:block;
}

/* Audio player */
.audio-player-wrap{
  position:relative;z-index:2;margin-top:12px;
  display:flex;justify-content:center;
}
.audio-player-wrap audio{
  width:260px;height:36px;border-radius:18px;
}
.audio-player-wrap audio::-webkit-media-controls-panel{
  background:rgba(255,255,255,0.15);
}
.audio-player-wrap audio::-webkit-media-controls-play-button,
.audio-player-wrap audio::-webkit-media-controls-current-time-display,
.audio-player-wrap audio::-webkit-media-controls-time-remaining-display{
  color:#fff;
}

.feedback-body{padding:20px}

.gauge-card{
  background:var(--card);border-radius:24px;padding:28px;
  text-align:center;box-shadow:var(--shadow);margin-bottom:16px;
}
.gauge-wrap{width:170px;height:170px;margin:0 auto 16px;position:relative}
.gauge-svg{transform:rotate(-90deg)}
.gauge-bg{fill:none;stroke:#F3F4F6;stroke-width:10}
.gauge-fill{
  fill:none;stroke-width:10;stroke-linecap:round;
  transition:stroke-dashoffset 1.8s cubic-bezier(0.4,0,0.2,1);
}
.gauge-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.gauge-num{font-size:52px;font-weight:800;line-height:1}
.gauge-label{font-size:13px;color:var(--text-2);font-weight:500;margin-top:4px}
.gauge-duration{
  display:inline-flex;align-items:center;gap:6px;
  background:#FFF0ED;padding:8px 16px;border-radius:12px;
  font-size:13px;color:var(--text-2);
}

.comment-card{
  background:linear-gradient(135deg,#FFFBEB,#FFF7ED);
  border:1px solid #FED7AA;border-radius:18px;
  padding:20px;margin-bottom:16px;
}
.comment-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.comment-icon{
  width:34px;height:34px;background:var(--pri-2);
  border-radius:10px;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:16px;font-weight:700;
}
.comment-title{font-size:16px;font-weight:600;color:#92400E}
.comment-text{font-size:15px;line-height:1.9;color:#78350F;min-height:40px}
.cursor-blink{
  display:inline-block;width:2px;height:16px;
  background:#78350F;animation:cblink 0.7s infinite;
  vertical-align:text-bottom;margin-left:1px;
}
@keyframes cblink{0%,100%{opacity:1}50%{opacity:0}}

.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.metric-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.metric-icon{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;margin-bottom:12px;
}
.metric-label{font-size:13px;color:var(--text-2);font-weight:500}
.metric-val{font-size:30px;font-weight:800;margin-top:4px}

.issues-card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.issues-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.issues-icon{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.issues-title{font-size:16px;font-weight:600;flex:1}
.issues-count{padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600}
.issue-item{
  background:#F9FAFB;border:1px solid #F3F4F6;
  border-radius:14px;padding:12px;margin-bottom:10px;
  display:flex;align-items:center;gap:12px;
}
.issue-measure{
  width:42px;height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;flex-shrink:0;
}
.issue-info{flex:1;min-width:0}
.issue-subtitle{font-size:14px;font-weight:600}
.issue-desc{font-size:13px;color:var(--text-2);margin-top:2px}
.issue-time{
  padding:4px 8px;background:#E5E7EB;border-radius:6px;
  font-size:11px;font-weight:600;color:var(--text-2);flex-shrink:0;
}

/* ===== REPORTS ===== */
#page-reports{background:var(--bg)}
.reports-list{padding:16px}
.report-item{
  background:var(--card);border-radius:var(--radius);padding:16px;
  margin-bottom:10px;display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow);cursor:pointer;
}
.report-badge{
  width:50px;height:50px;border-radius:50%;
  background:#FFF0ED;display:flex;align-items:center;
  justify-content:center;font-size:18px;font-weight:700;
  color:var(--pri-1);flex-shrink:0;
}
.report-info{flex:1;min-width:0}
.report-comment{
  font-size:14px;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.report-date{font-size:12px;color:var(--text-3);margin-top:4px}
.empty-state{text-align:center;padding:80px 24px;color:var(--text-3)}

/* ===== SETTINGS ===== */
#page-settings{background:var(--bg)}
.settings-body{padding:16px}
.settings-section{
  font-size:13px;font-weight:600;color:var(--pri-1);
  margin:20px 0 10px;padding-left:4px;text-transform:uppercase;letter-spacing:0.5px;
}
.settings-section:first-child{margin-top:4px}
.settings-field{margin-bottom:12px}
.settings-field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:4px;font-weight:500}
.settings-field input,.settings-field textarea,.settings-field select{
  width:100%;padding:12px 14px;border:1.5px solid #E5E7EB;
  border-radius:12px;font-size:14px;font-family:inherit;
  background:var(--card);transition:all 0.2s;
}
.settings-field input:focus,.settings-field textarea:focus,.settings-field select:focus{
  outline:none;border-color:var(--pri-1);
  box-shadow:0 0 0 3px rgba(255,107,107,0.1);
}
.preset-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.preset-chip{
  padding:6px 14px;border-radius:20px;
  background:#FFF0ED;border:1px solid #FFDDD5;
  font-size:13px;color:var(--pri-1);cursor:pointer;
  transition:all 0.2s;font-weight:500;
}
.preset-chip:hover{background:#FFDDD5}
.save-btn{
  width:100%;padding:16px;margin-top:20px;
  background:var(--grad);color:#fff;border:none;
  border-radius:var(--radius);font-size:16px;
  font-weight:600;cursor:pointer;transition:all 0.2s;
}
.save-btn:hover{opacity:0.9;transform:translateY(-1px)}
.save-btn.secondary{background:#374151;margin-top:10px}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:#2D2D2D;color:#fff;padding:12px 24px;
  border-radius:14px;font-size:14px;z-index:300;
  animation:toastIn 0.3s ease-out;white-space:nowrap;
  box-shadow:0 8px 30px rgba(0,0,0,0.3);
}
@keyframes toastIn{
  from{opacity:0;transform:translateX(-50%) translateY(10px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}

.fade-up{
  opacity:0;transform:translateY(24px);
  transition:opacity 0.6s ease-out,transform 0.6s ease-out;
}
.fade-up.show{opacity:1;transform:translateY(0)}

.hidden{display:none}
</style>
</head>
<body>

<div class="phone-frame">
<div class="phone-screen">
<div class="pages">

<!-- ===== HOME ===== -->
<div class="page active" id="page-home">
  <div class="home-header">
    <div class="home-top">
      <div class="home-logo">
        <div class="home-logo-icon">🎹</div>
        <div class="home-title">琴伴</div>
      </div>
      <div class="home-actions">
        <button class="icon-btn" onclick="go('reports')" title="历史报告">📋</button>
        <button class="icon-btn" onclick="go('settings')" title="设置">⚙️</button>
      </div>
    </div>
    <div class="home-greeting">
      <h2>今天也要加油练琴哦</h2>
      <p>让老师陪你一起进步 ♪</p>
    </div>
  </div>
  <div class="home-body">
    <div class="score-card" id="scoreCard">
      <div class="score-icon empty" id="scoreIcon">🎵</div>
      <div class="score-info">
        <div class="label">当前曲谱</div>
        <div class="name" id="scoreName">尚未上传</div>
      </div>
    </div>
    <button class="btn btn-upload" id="uploadBtn" onclick="pickScoreFile()">
      📤 <span id="uploadLabel">上传曲谱</span>
    </button>
    <input type="file" id="scoreFileInput" class="hidden" accept=".jpg,.jpeg,.png,.pdf" onchange="handleScoreFile(this)">
    <button class="btn btn-primary" onclick="startPractice()">
      ▶️ 开始练习
    </button>
    <div class="tips-card">
      <div class="tips-header">
        <div class="tips-icon">💡</div>
        <div class="tips-title">小贴士</div>
      </div>
      <div class="tip-row"><div class="dot"></div>把手机后置摄像头对准琴键</div>
      <div class="tip-row"><div class="dot"></div>保持充足的光线，能看清你的手型</div>

<script>
// ===== Environment Detection =====
const IN_WEBVIEW = typeof window.Flutter !== 'undefined';
let BACKEND_BASE = localStorage.getItem('baseUrl') || 'http://localhost:8000';

let currentPage = 'home';
let timerInterval = null;
let timerSec = 0;
let scoreUploaded = false;
let selectedVideoFile = null;
let currentReport = null;

// ===== Navigation =====
function go(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  currentPage = id;
  document.querySelector('.pages').scrollTop = 0;
  if (id === 'reports') loadReports();
  if (id === 'settings') loadSettings();
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ===== Score File Upload =====
function pickScoreFile() {
  document.getElementById('scoreFileInput').click();
}
function handleScoreFile(input) {
  if (input.files[0]) {
    scoreUploaded = true;
    document.getElementById('scoreName').textContent = input.files[0].name;
    document.getElementById('scoreIcon').className = 'score-icon has';
    document.getElementById('uploadLabel').textContent = '上传曲谱';
    const card = document.getElementById('scoreCard');
    if (!card.querySelector('.score-badge')) {
      const b = document.createElement('div');
      b.className = 'score-badge'; b.textContent = '已选择'; card.appendChild(b);
    }
  }
  input.value = '';
}

// ===== Video File Upload =====
function pickVideoFile() {
  document.getElementById('videoFileInput').click();
}
function handleVideoFile(input) {
  if (input.files[0]) {
    selectedVideoFile = input.files[0];
    document.getElementById('videoFileName').textContent = selectedVideoFile.name;
    toast('已选择: ' + selectedVideoFile.name);
    // Auto-upload
    uploadAndEvaluate();
  }
  input.value = '';
}

// ===== Practice Flow =====
function startPractice() {
  go('practice');
  timerSec = 0; updateTimer();

  if (IN_WEBVIEW) {
    // WebView mode: send message to Flutter for native recording
    document.getElementById('uploadArea').classList.add('hidden');
    document.getElementById('recBadge').classList.remove('hidden');
    document.getElementById('practiceHint').textContent = '沉浸式练琴中...\n弹完后点击下方停止';
    window.Flutter.postMessage(JSON.stringify({ action: 'startRecording' }));
    startTimer();
  } else {
    // PC browser mode: show file upload
    document.getElementById('uploadArea').classList.remove('hidden');
    document.getElementById('recBadge').classList.add('hidden');
    document.getElementById('practiceHint').textContent = '选择视频文件开始分析';
    selectedVideoFile = null;
    document.getElementById('videoFileName').textContent = '支持 mp4 / mov 格式';
  }
}

function startTimer() {
  timerInterval = setInterval(() => { timerSec++; updateTimer(); }, 1000);
}
function updateTimer() {
  const m = String(Math.floor(timerSec / 60)).padStart(2, '0');
  const s = String(timerSec % 60).padStart(2, '0');
  document.getElementById('practiceTimer').textContent = m + ':' + s;
}

function stopPractice() {
  clearInterval(timerInterval);

  if (IN_WEBVIEW) {
    window.Flutter.postMessage(JSON.stringify({ action: 'stopRecording' }));
  }
  // PC mode: just go back if no file selected, otherwise upload
  if (!IN_WEBVIEW && !selectedVideoFile) {
    go('home');
  } else if (!IN_WEBVIEW && selectedVideoFile) {
    // Already uploading from handleVideoFile
  } else {
    go('loading');
    animateLoading();
  }
}

// ===== API: Upload & Evaluate =====
async function uploadAndEvaluate() {
  if (!selectedVideoFile) {
    toast('请先选择视频文件');
    return;
  }

  go('loading');
  animateLoading();

  const formData = new FormData();
  formData.append('file', selectedVideoFile);

  try {
    const resp = await fetch(BACKEND_BASE + '/api/evaluate', {
      method: 'POST',
      body: formData,
    });
    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.detail || '请求失败');
    }
    const data = await resp.json();
    currentReport = data;
    // Stop loading animation and show feedback
    showFeedbackFromAPI(data);
  } catch (e) {
    console.error('Evaluate error:', e);
    toast('分析失败: ' + e.message);
    go('home');
  }
}

// ===== Loading Animation =====
function animateLoading() {
  const steps = ['step1','step2','step3','step4'];
  const labels = ['分析手型中…','比对音频中…','生成评语中…','合成语音中…'];
  let i = 0;
  const sub = document.getElementById('loadingSub');
  steps.forEach(s => document.getElementById(s).classList.remove('active'));
  function next() {
    if (i > 0) document.getElementById(steps[i-1]).classList.add('active');
    if (i < steps.length) {
      sub.textContent = labels[i];
      document.getElementById(steps[i]).classList.add('active');
      i++; setTimeout(next, 700);
    }
    // Actual API call comes from uploadAndEvaluate, not from animation
  }
  setTimeout(next, 300);
}

// ===== Feedback Rendering =====
function showFeedbackFromAPI(data) {
  const r = data.report;
  const audioUrl = data.audio_url;
  const color = r.overall_score >= 90 ? 'var(--success)' : r.overall_score >= 75 ? 'var(--warn)' : 'var(--danger)';
  const circ = 2 * Math.PI * 72;
  const offset = circ * (1 - r.overall_score / 100);

  let html = `
    <div class="gauge-card fade-up" id="anim-gauge">
      <div class="gauge-wrap">
        <svg class="gauge-svg" width="170" height="170" viewBox="0 0 170 170">
          <circle class="gauge-bg" cx="85" cy="85" r="72"/>
          <circle class="gauge-fill" cx="85" cy="85" r="72" stroke="${color}" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="gaugeFill"/>
        </svg>
        <div class="gauge-center">
          <div class="gauge-num" id="gaugeNum" style="color:${color}">0</div>
          <div class="gauge-label">综合评分</div>
        </div>
      </div>
      <div class="gauge-duration">🕐 练习时长 ${Math.round(r.duration_seconds)} 秒</div>
    </div>
    <div class="comment-card fade-up" id="anim-comment">
      <div class="comment-header">
        <div class="comment-icon">💬</div>
        <div class="comment-title">老师的话</div>
      </div>
      <div class="comment-text" id="commentText"></div>
    </div>
    <div class="metrics-grid fade-up" id="anim-metrics">
      <div class="metric-card">
        <div class="metric-icon" style="background:rgba(59,130,246,0.1);color:var(--info)">🎶</div>
        <div class="metric-label">节奏稳定</div>
        <div class="metric-val" style="color:var(--info)">${r.rhythm_score}</div>
      </div>
      <div class="metric-card">
        <div class="metric-icon" style="background:rgba(16,185,129,0.1);color:var(--success)">🎵</div>
        <div class="metric-label">音准准确</div>
        <div class="metric-val" style="color:var(--success)">${r.accuracy_score}</div>
      </div>
      <div class="metric-card">
        <div class="metric-icon" style="background:rgba(245,158,11,0.1);color:var(--warn)">🌊</div>
        <div class="metric-label">流畅度</div>
        <div class="metric-val" style="color:var(--warn)">${r.fluency_score}</div>
      </div>
      <div class="metric-card">
        <div class="metric-icon" style="background:rgba(139,92,246,0.1);color:var(--purple)">✋</div>
        <div class="metric-label">手型健康</div>
        <div class="metric-val" style="color:var(--purple)">${r.hand_health_score}</div>
      </div>
    </div>`;

  if (r.hand_issues && r.hand_issues.length) {
    html += `<div class="issues-card fade-up" id="anim-hand">
      <div class="issues-header">
        <div class="issues-icon" style="background:rgba(249,115,22,0.1);color:#F97316">✋</div>
        <div class="issues-title">手型问题</div>
        <div class="issues-count" style="background:rgba(249,115,22,0.1);color:#F97316">${r.hand_issues.length} 处</div>
      </div>`;
    r.hand_issues.slice(0, 10).forEach(i => {
      html += `<div class="issue-item">
        <div class="issue-measure" style="background:rgba(249,115,22,0.1);color:#F97316">${i.measure || '?'}</div>
        <div class="issue-info"><div class="issue-subtitle">${i.issue_type || '手型问题'}</div><div class="issue-desc">${i.description || ''}</div></div>
        <div class="issue-time">${(i.timestamp || 0).toFixed(1)}s</div></div>`;
    });
    html += '</div>';
  }
  if (r.audio_issues && r.audio_issues.length) {
    html += `<div class="issues-card fade-up" id="anim-audio">
      <div class="issues-header">
        <div class="issues-icon" style="background:rgba(139,92,246,0.1);color:var(--purple)">🎵</div>
        <div class="issues-title">音准问题</div>
        <div class="issues-count" style="background:rgba(139,92,246,0.1);color:var(--purple)">${r.audio_issues.length} 处</div>
      </div>`;
    r.audio_issues.slice(0, 10).forEach(i => {
      const t = i.issue_type || '';
      const d = t.includes('missing') ? `漏弹 ${i.expected || ''}` : t.includes('wrong') ? `应为 ${i.expected || ''}，弹成了 ${i.actual || ''}` : (i.description || t);
      html += `<div class="issue-item">
        <div class="issue-measure" style="background:rgba(139,92,246,0.1);color:var(--purple)">${i.measure || '?'}</div>
        <div class="issue-info"><div class="issue-subtitle">${i.issue_type || '音准问题'}</div><div class="issue-desc">${d}</div></div>
        <div class="issue-time">${(i.timestamp || 0).toFixed(1)}s</div></div>`;
    });
    html += '</div>';
  }

  document.getElementById('feedbackBody').innerHTML = html;

  // Set up audio player
  const audio = document.getElementById('ttsAudio');
  if (audioUrl) {
    audio.src = audioUrl;
    audio.load();
  }
  document.getElementById('audioPlayerWrap').style.display = audioUrl ? 'flex' : 'none';

  go('feedback');

  // Animations
  setTimeout(() => {
    document.getElementById('anim-gauge').classList.add('show');
    document.getElementById('gaugeFill').style.strokeDashoffset = offset;
    animateNum('gaugeNum', 0, r.overall_score, 1800);
  }, 200);
  setTimeout(() => document.getElementById('anim-comment').classList.add('show'), 600);
  setTimeout(() => typewriter('commentText', r.teacher_comment || '', 2500), 900);
  setTimeout(() => document.getElementById('anim-metrics').classList.add('show'), 1200);
  setTimeout(() => { const h = document.getElementById('anim-hand'); if (h) h.classList.add('show'); }, 1500);
  setTimeout(() => { const a = document.getElementById('anim-audio'); if (a) a.classList.add('show'); }, 1800);
  // Auto-play audio once after animations
  setTimeout(() => {
    if (audioUrl && audio) {
      audio.play().catch(() => {});
    }
  }, 2500);
}

function animateNum(id, from, to, dur) {
  const el = document.getElementById(id);
  if (!el) return;
  const start = performance.now();
  function tick(now) {
    const p = Math.min((now - start) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * eased);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function typewriter(id, text, dur) {
  const el = document.getElementById(id);
  if (!el) return;
  const delay = Math.min(dur / Math.max(text.length, 1), 60);
  let i = 0;
  el.innerHTML = '<span class="cursor-blink"></span>';
  const iv = setInterval(() => {
    if (i >= text.length) { clearInterval(iv); el.innerHTML = text; return; }
    el.innerHTML = text.substring(0, i + 1) + '<span class="cursor-blink"></span>';
    i++;
  }, delay);
}

// ===== Reports =====
async function loadReports() {
  const list = document.getElementById('reportsList');
  const empty = document.getElementById('reportsEmpty');
  try {
    const resp = await fetch(BACKEND_BASE + '/api/reports?limit=50');
    if (!resp.ok) throw new Error('请求失败');
    const data = await resp.json();
    if (!data.length) {
      list.innerHTML = '<div class="empty-state">还没有练习记录<br>快去练琴吧 ♪</div>';
      return;
    }
    list.innerHTML = data.map(r => `
      <div class="report-item" onclick="viewReport('${r.report_id}')">
        <div class="report-badge">${r.overall_score}</div>
        <div class="report-info">
          <div class="report-comment">${r.teacher_comment || '暂无评语'}</div>
          <div class="report-date">${r.created_at ? r.created_at.replace('T', ' ').substring(0, 19) : ''}</div>
        </div>
      </div>`).join('');
  } catch (e) {
    console.error('Reports error:', e);
    list.innerHTML = '<div class="empty-state">加载失败<br>请检查后端连接</div>';
  }
}

async function viewReport(reportId) {
  try {
    const resp = await fetch(BACKEND_BASE + '/api/reports/' + reportId);
    if (!resp.ok) throw new Error('请求失败');
    const data = await resp.json();
    // Build a compatible response structure
    const apiData = {
      status: 'success',
      report_id: data.report_id,
      report: data.report,
      audio_url: data.report.audio_url || '',
    };
    currentReport = apiData;
    showFeedbackFromAPI(apiData);
  } catch (e) {
    toast('加载报告失败');
  }
}

// ===== Settings =====
async function loadSettings() {
  // Set base URL from localStorage
  document.getElementById('setBaseUrl').value = BACKEND_BASE;

  // Load CosyVoice speakers
  try {
    const resp = await fetch(BACKEND_BASE + '/api/cosyvoice/speakers');
    if (resp.ok) {
      const data = await resp.json();
      const sel = document.getElementById('setCosyVoice');
      sel.innerHTML = '';
      const savedVoice = localStorage.getItem('cosyvoiceVoice') || '';
      (data.speakers || data || []).forEach(s => {
        const name = typeof s === 'string' ? s : (s.name || s.id || s);
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        if (name === savedVoice) opt.selected = true;
        sel.appendChild(opt);
      });
    }
  } catch (e) {
    console.log('Could not fetch CosyVoice speakers:', e);
  }

  // Load saved engine preference
  const savedEngine = localStorage.getItem('ttsEngine') || 'cosyvoice';
  document.getElementById('setTtsEngine').value = savedEngine;
  onTtsEngineChange();
}

async function saveSettings() {
  const baseUrl = document.getElementById('setBaseUrl').value.trim();
  const llmUrl = document.getElementById('setLlmUrl').value.trim();
  const apiKey = document.getElementById('setApiKey').value.trim();
  const model = document.getElementById('setModel').value.trim();
  const ttsEngine = document.getElementById('setTtsEngine').value;
  const cosyVoice = document.getElementById('setCosyVoice').value;
  const ttsVoice = document.getElementById('setTtsVoice').value.trim();

  localStorage.setItem('baseUrl', baseUrl);
  localStorage.setItem('ttsEngine', ttsEngine);
  localStorage.setItem('cosyvoiceVoice', cosyVoice);
  BACKEND_BASE = baseUrl;

  // Sync to backend
  const ttsCfg = ttsEngine === 'cosyvoice'
    ? { engine: 'cosyvoice', cosyvoice_speaker: cosyVoice, cosyvoice_url: 'http://127.0.0.1:9880' }
    : { engine: 'edge-tts', voice: ttsVoice };

  try {
    await fetch(BACKEND_BASE + '/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        llm: { base_url: llmUrl, api_key: apiKey, model: model },
        tts: ttsCfg,
      }),
    });
    toast('已保存，新配置立即生效 ✓');
  } catch (e) {
    // Backend not available is OK - settings saved locally
    toast('本地配置已保存 ✓ (后端未连接)');
  }
}

function onBaseUrlChange() {
  BACKEND_BASE = document.getElementById('setBaseUrl').value.trim();
  localStorage.setItem('baseUrl', BACKEND_BASE);
}

function onTtsEngineChange() {
  const engine = document.getElementById('setTtsEngine').value;
  document.getElementById('cosyvoiceVoiceField').style.display = engine === 'cosyvoice' ? '' : 'none';
  document.getElementById('edgeVoiceField').style.display = engine === 'edge-tts' ? '' : 'none';
}

async function testLLM() {
  try {
    const resp = await fetch(BACKEND_BASE + '/api/config/test', { method: 'POST' });
    if (resp.ok) {
      toast('LLM 连通成功 ✓');
    } else {
      toast('LLM 连接失败');
    }
  } catch (e) {
    toast('LLM 测试失败，请检查后端');
  }
}

// ===== LLM Presets =====
const PRESETS = {
  deepseek: { url: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
  qwen: { url: 'https://dashscope.aliyuncs.com/compatible-mode/v1', model: 'qwen-plus' },
  glm: { url: 'https://open.bigmodel.cn/api/paas/v4', model: 'glm-4' },
  kimi: { url: 'https://api.moonshot.cn/v1', model: 'moonshot-v1-8k' },
  ollama: { url: 'http://127.0.0.1:11434/v1', model: 'qwen2.5:7b' },
};
function applyPreset(name) {
  const p = PRESETS[name];
  document.getElementById('setLlmUrl').value = p.url;
  document.getElementById('setModel').value = p.model;
  toast('已切换到 ' + name);
}

// ===== WebView Message Handler =====
// Called by Flutter when it has a report result to inject
window.addEventListener('message', function(e) {
  try {
    const msg = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
    if (msg.type === 'report') {
      // Flutter sent us a report JSON
      currentReport = msg.data;
      showFeedbackFromAPI(msg.data);
    } else if (msg.type === 'recordingStarted') {
      timerSec = 0; updateTimer(); startTimer();
    } else if (msg.type === 'recordingStopped') {
      clearInterval(timerInterval);
    } else if (msg.type === 'evaluateStart') {
      go('loading');
      animateLoading();
    }
  } catch (e) {}
});

// Listen for messages from Flutter WebView JavaScriptChannel
if (IN_WEBVIEW) {
  // Flutter's JavaScriptChannel calls this
  window.onFlutterMessage = function(msg) {
    try {
      const data = typeof msg === 'string' ? JSON.parse(msg) : msg;
      if (data.type === 'report') {
        currentReport = data.data;
        showFeedbackFromAPI(data.data);
      }
    } catch (e) {}
  };
}

// Initialize
go('home');
</script>
